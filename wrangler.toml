name = "teammarysy-bot"
main = "src/index.ts"
compatibility_date = "2026-08-29"

[[d1_databases]]
binding = "DB"
database_name = "teammarysy"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
# Used for composer session state (TTL-based) and webhook idempotency
# markers. Not a message archive.
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
# Runs every minute. Cloudflare Cron uses UTC.
crons = ["* * * * *"]

[vars]
# Non-secret configuration only.
BOT_USERNAME = "TeamMarySyBot"
APP_TIMEZONE = "Asia/Manila"
